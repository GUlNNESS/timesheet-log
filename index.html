<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timesheet log</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2330;--mut:#667085;--line:#dde1e8;--acc:#1f5eff;--onacc:#fff;--bad:#c62828;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--ink:#e8ebf0;--mut:#98a2b3;--line:#2c3340;--acc:#6b95ff;--onacc:#0d1220;--bad:#ef7b7b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px 12px 48px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:1.25rem;margin:0}
button,input,select{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
button.link{border:0;background:none;color:var(--acc);padding:4px 6px}
button.del{color:var(--bad)}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mut)}
form .wide{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips:empty{display:none}
.chips button{padding:4px 10px;font-size:.85rem;border-radius:999px}
.tm{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row{display:flex;gap:8px;align-items:center}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.nav strong{font-size:1rem}
.day h2{font-size:1rem;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.day h2 span{color:var(--mut);font-weight:400;font-size:.9rem}
.day h2 b{font-weight:600}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{color:var(--mut);font-weight:400;text-align:left;padding:2px 4px 4px;font-size:.8rem}
td{padding:6px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
td.code{font-weight:600;text-align:center}
td.act{text-align:right}
.sum{display:flex;gap:16px;margin-top:8px;padding:6px 8px;border-radius:8px;background:var(--bg);font-size:.9rem}
.sum span{color:var(--mut)}
.entry{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.entry .t{font-variant-numeric:tabular-nums}
.entry .m{color:var(--mut);font-size:.85rem}
.empty{color:var(--mut);font-size:.9rem;margin:0}
#msg{color:var(--bad);min-height:1.2em;font-size:.9rem}
#login{text-align:center;padding:32px 12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header><h1>Timesheet log</h1><button id="out" class="link" hidden>Sign out</button></header>

<p id="msg" role="status"></p>

<section id="login" class="card" hidden>
  <p>Sign in to log your hours.</p>
  <button id="in" class="pri">Sign in with Google</button>
</section>

<section id="app" hidden>
  <form id="f" class="card">
    <label>Date<input type="date" id="date" required></label>
    <label>Category<select id="cat"></select></label>
    <label class="wide">Job (Pop Up)<input id="job" list="jobs" autocomplete="off" required></label>
    <datalist id="jobs"></datalist>
    <div id="chips" class="wide chips"></div>
    <label>Start<div class="tm"><select id="start_h" required></select><select id="start_m"></select></div></label>
    <label>End<div class="tm"><select id="end_h" required></select><select id="end_m"></select></div></label>
    <div class="wide row">
      <button class="pri" id="save">Add entry</button>
      <button type="button" id="cancel" hidden>Cancel edit</button>
    </div>
  </form>

  <div class="nav">
    <button id="prev" aria-label="Previous week">Prev</button>
    <strong id="wk"></strong>
    <button id="next" aria-label="Next week">Next</button>
  </div>
  <div class="row" style="margin-bottom:12px"><button id="copywk">Copy week</button></div>
  <div id="days"></div>
  <div class="card">
    <p style="margin:0 0 8px">Import entries from a file</p>
    <input type="file" id="imp" accept=".json,application/json">
  </div>
</section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,writeBatch,addDoc,setDoc,deleteDoc,query,where,orderBy,limit,onSnapshot,getDocs} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYjE6Esp-CKEWY2JWwlbsWQGm20Sl-usU",
  authDomain: "timesheet-log-b171f.firebaseapp.com",
  projectId: "timesheet-log-b171f",
  storageBucket: "timesheet-log-b171f.firebasestorage.app",
  messagingSenderId: "985825580832",
  appId: "1:985825580832:web:9c2ef3f4cc896512612945"
};

// Category -> code typed into the PM tool (matches the "Short" column)
const CATS = {"Travel":"T","Service":"S","Misc":"M","Annual Leave":"A","Bank Holiday":"B"};
// OT estimate (weekdays only): time before STD_START plus time after STD_END
const STD_START = "09:00", STD_END = "17:30", NO_OT = ["Annual Leave","Bank Holiday"], NO_JOB = ["Annual Leave","Bank Holiday"];

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

let user = null, weekStart = mondayOf(new Date()), entries = [], editId = null, unsub = null;
const jobs = new Set(), recent = [];

// ---------- date helpers (local time) ----------
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function parseIso(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }
const fmt = (d, o) => d.toLocaleDateString("en-GB", o);
const mins = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const dur = m => `${Math.floor(m/60)}h${m%60 ? " "+pad(m%60)+"m" : ""}`;

// ---------- UI setup ----------

// Time pickers: hour + minute (00, 15, 30, 45 only). T.start.value / T.end.value read and write "HH:MM".
function makeTime(id){
  const h = $(id + "_h"), m = $(id + "_m");
  h.innerHTML = '<option value="">--</option>' + Array.from({length:24}, (_, i) => `<option>${pad(i)}</option>`).join("");
  m.innerHTML = ["00","15","30","45"].map(x => `<option>${x}</option>`).join("");
  return {
    get value(){ return h.value ? `${h.value}:${m.value}` : ""; },
    set value(v){
      if (!v) { h.value = ""; m.value = "00"; return; }
      const [hh, mm] = v.split(":").map(Number);
      h.value = pad(hh); m.value = pad(Math.floor(mm / 15) * 15);
    }
  };
}
const T = {start: makeTime("start"), end: makeTime("end")};
$("cat").innerHTML = Object.keys(CATS).map(c => `<option>${c}</option>`).join("");
$("date").value = iso(new Date());

$("in").onclick = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { say("Sign-in failed: " + e.code); }
};
$("out").onclick = () => signOut(auth);
$("prev").onclick = () => { weekStart = addDays(weekStart, -7); listen(); };
$("next").onclick = () => { weekStart = addDays(weekStart, 7); listen(); };
$("date").onchange = suggestStart;
$("cat").onchange = () => { $("job").required = !NO_JOB.includes($("cat").value); };
$("cancel").onclick = resetForm;
$("f").onsubmit = save;

function say(t){ $("msg").textContent = t || ""; }

onAuthStateChanged(auth, async u => {
  user = u;
  $("login").hidden = !!u; $("app").hidden = !u; $("out").hidden = !u;
  if (unsub) { unsub(); unsub = null; }
  if (!u) return;
  loadJobs();
  listen();
});

async function loadJobs(){
  try {
    const q = query(col(), orderBy("date","desc"), limit(300));
    recent.length = 0;
    (await getDocs(q)).forEach(d => { const j = d.data().job; if (j) { jobs.add(j); if (!recent.includes(j)) recent.push(j); } });
    fillJobs();
  } catch (e) { say("Could not load recent jobs: " + e.code); }
}
function fillJobs(){
  $("jobs").innerHTML = [...jobs].sort().map(j => `<option value="${esc(j)}">`).join("");
  $("chips").innerHTML = recent.slice(0, 10).map(j => `<button type="button" data-job="${esc(j)}">${esc(j)}</button>`).join("");
}
$("chips").onclick = e => { const b = e.target.closest("button"); if (b) { $("job").value = b.dataset.job; $("job").focus(); } };

const col = () => collection(db, "users", user.uid, "entries");

function listen(){
  if (unsub) unsub();
  const q = query(col(), where("date", ">=", iso(weekStart)), where("date", "<=", iso(addDays(weekStart, 6))));
  unsub = onSnapshot(q, snap => {
    entries = snap.docs.map(d => ({id: d.id, ...d.data()}));
    entries.sort((a,b) => (a.date+a.start).localeCompare(b.date+b.start));
    say(""); render(); suggestStart();
  }, e => say("Could not load entries: " + e.code));
}

// ---------- render ----------
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function render(){
  $("wk").textContent = `${fmt(weekStart,{day:"numeric",month:"short"})} to ${fmt(addDays(weekStart,6),{day:"numeric",month:"short",year:"numeric"})}`;
  let html = "";
  for (let i = 0; i < 7; i++) {
    const d = addDays(weekStart, i), key = iso(d);
    const list = entries.filter(e => e.date === key);
    if (i >= 5 && !list.length) continue;
    const total = list.reduce((s,e) => s + mins(e.end) - mins(e.start), 0);
    html += `<section class="card day"><h2><span style="color:var(--ink);font-size:1rem">${fmt(d,{day:"2-digit",month:"2-digit",year:"2-digit"})} <b>${fmt(d,{weekday:"long"})}</b></span><span>${list.length ? dur(total) : ""}</span></h2>`;
    if (!list.length) { html += `<p class="empty">No entries.</p></section>`; continue; }
    html += `<div class="tw"><table><thead><tr><th>Category</th><th>Pop Up</th><th>Time A</th><th>Time B</th><th>Short</th><th></th></tr></thead><tbody>` +
      list.map(e => `<tr><td>${esc(e.category)}</td><td>${esc(e.job)}</td><td>${e.start}</td><td>${e.end}</td><td class="code">${esc(e.code)}</td>
        <td class="act"><button class="link" data-edit="${e.id}">Edit</button><button class="link del" data-del="${e.id}">Del</button></td></tr>`).join("") +
      `</tbody></table></div>`;
    const finish = list.map(e => e.end).sort().pop();
    let sum = `<span>Finish</span> ${finish}`;
    if (i < 5 && !list.some(e => NO_OT.includes(e.category))) {
      const first = list.map(e => e.start).sort()[0];
      const ot = Math.max(0, mins(STD_START) - mins(first)) + Math.max(0, mins(finish) - mins(STD_END));
      sum += ` &nbsp; <span>OT (est.)</span> ${(ot/60).toFixed(2)}h`;
    }
    html += `<div class="sum">${sum}</div></section>`;
  }
  $("days").innerHTML = html;
}

$("days").onclick = async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.edit) startEdit(b.dataset.edit);
  if (b.dataset.del && confirm("Delete this entry?")) {
    try { await deleteDoc(doc(col(), b.dataset.del)); if (editId === b.dataset.del) resetForm(); }
    catch (err) { say("Delete failed: " + err.code); }
  }
};

// Copy week: one row per entry, tab-separated: Date, Category, Pop Up, Time A, Time B, Short
$("copywk").onclick = async () => {
  const tsv = entries.map(e => [e.date.split("-").reverse().join("/"), e.category, e.job, e.start, e.end, e.code].join("\t")).join("\n");
  if (!tsv) return say("No entries this week.");
  try { await navigator.clipboard.writeText(tsv); say(""); $("copywk").textContent = "Copied"; setTimeout(() => $("copywk").textContent = "Copy week", 1500); }
  catch { say("Copy failed. Your browser blocked clipboard access."); }
};

// ---------- import (JSON list of entries; safe to repeat, same entry = same id) ----------
function hash(str){ let h = 5381; for (const c of str) h = ((h * 33) ^ c.charCodeAt(0)) >>> 0; return h.toString(36); }
$("imp").onchange = async ev => {
  const file = ev.target.files[0]; if (!file) return;
  try {
    const list = JSON.parse(await file.text());
    if (!Array.isArray(list)) throw new Error("not a list");
    const ok = list.filter(e => e.date && CATS[e.category] && e.start && e.end);
    if (!confirm(`Import ${ok.length} entries?`)) { ev.target.value = ""; return; }
    for (let i = 0; i < ok.length; i += 400) {
      const b = writeBatch(db);
      for (const e of ok.slice(i, i + 400)) {
        const id = `${e.date}_${e.start.replace(":","")}_${e.end.replace(":","")}_${CATS[e.category]}_${hash(e.job || "")}`;
        b.set(doc(col(), id), {date: e.date, category: e.category, code: CATS[e.category], job: e.job || "", start: e.start, end: e.end, updated: Date.now()});
      }
      await b.commit();
      say(`Imported ${Math.min(i + 400, ok.length)} of ${ok.length}...`);
    }
    say(`Imported ${ok.length} entries.`);
    loadJobs();
  } catch (e) { say("Import failed: " + (e.code || e.message)); }
  ev.target.value = "";
};

// ---------- form ----------
function startEdit(id){
  const e = entries.find(x => x.id === id); if (!e) return;
  editId = id;
  $("date").value = e.date; $("cat").value = e.category; $("job").value = e.job;
  T.start.value = e.start; T.end.value = e.end;
  $("job").required = !NO_JOB.includes(e.category);
  $("save").textContent = "Save changes"; $("cancel").hidden = false;
  $("f").scrollIntoView({behavior:"smooth"});
}
function resetForm(){
  editId = null; $("job").value = ""; T.end.value = "";
  $("save").textContent = "Add entry"; $("cancel").hidden = true;
  suggestStart();
}
function suggestStart(){
  if (editId) return;
  const last = entries.filter(e => e.date === $("date").value).map(e => e.end).sort().pop();
  if (last) T.start.value = last;
}

async function save(ev){
  ev.preventDefault();
  const job = $("job").value.trim(), start = T.start.value, end = T.end.value, cat = $("cat").value;
  if (!start || !end) return say("Choose a start and end time.");
  if (!job && !NO_JOB.includes(cat)) return say("Enter a job name.");
  if (mins(start) % 15 || mins(end) % 15) return say("Times must be on 00, 15, 30 or 45 minutes.");
  if (mins(end) <= mins(start)) return say("End time must be after start time.");
  const data = {date: $("date").value, category: cat, code: CATS[cat], job, start, end, updated: Date.now()};
  try {
    if (editId) await setDoc(doc(col(), editId), data); else await addDoc(col(), data);
    if (job) { jobs.add(job); const i = recent.indexOf(job); if (i >= 0) recent.splice(i, 1); recent.unshift(job); fillJobs(); } say("");
    const w = mondayOf(parseIso(data.date));
    const moved = iso(w) !== iso(weekStart);
    if (moved) { weekStart = w; listen(); }
    const wasEdit = !!editId;
    editId = null; $("save").textContent = "Add entry"; $("cancel").hidden = true;
    $("job").value = ""; T.end.value = ""; T.start.value = end;
    if (wasEdit) suggestStart();
  } catch (e) { say("Save failed: " + e.code); }
}
</script>
</body>
</html>
