<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timesheet log</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2330;--mut:#667085;--line:#dde1e8;--acc:#1f5eff;--onacc:#fff;--bad:#c62828;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--ink:#e8ebf0;--mut:#98a2b3;--line:#2c3340;--acc:#6b95ff;--onacc:#0d1220;--bad:#ef7b7b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px 12px 48px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:1.25rem;margin:0}
button,input,select{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
button.link{border:0;background:none;color:var(--acc);padding:4px 6px}
button.del{color:var(--bad)}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mut)}
form .wide{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.nav strong{font-size:1rem}
.day h2{font-size:1rem;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.day h2 span{color:var(--mut);font-weight:400;font-size:.9rem}
.entry{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.entry .t{font-variant-numeric:tabular-nums}
.entry .m{color:var(--mut);font-size:.85rem}
.empty{color:var(--mut);font-size:.9rem;margin:0}
#msg{color:var(--bad);min-height:1.2em;font-size:.9rem}
#login{text-align:center;padding:32px 12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header><h1>Timesheet log</h1><button id="out" class="link" hidden>Sign out</button></header>

<p id="msg" role="status"></p>

<section id="login" class="card" hidden>
  <p>Sign in to log your hours.</p>
  <button id="in" class="pri">Sign in with Google</button>
</section>

<section id="app" hidden>
  <form id="f" class="card">
    <label>Date<input type="date" id="date" required></label>
    <label>Category<select id="cat"></select></label>
    <label class="wide">Job<input id="job" list="jobs" autocomplete="off" required></label>
    <datalist id="jobs"></datalist>
    <label>Start<input type="time" id="start" required></label>
    <label>End<input type="time" id="end" required></label>
    <div class="wide row">
      <button class="pri" id="save">Add entry</button>
      <button type="button" id="cancel" hidden>Cancel edit</button>
    </div>
  </form>

  <div class="nav">
    <button id="prev" aria-label="Previous week">Prev</button>
    <strong id="wk"></strong>
    <button id="next" aria-label="Next week">Next</button>
  </div>
  <div id="days"></div>
</section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,setDoc,deleteDoc,query,where,orderBy,limit,onSnapshot,getDocs} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYjE6Esp-CKEWY2JWwlbsWQGm20Sl-usU",
  authDomain: "timesheet-log-b171f.firebaseapp.com",
  projectId: "timesheet-log-b171f",
  storageBucket: "timesheet-log-b171f.firebasestorage.app",
  messagingSenderId: "985825580832",
  appId: "1:985825580832:web:9c2ef3f4cc896512612945"
};

// Category -> code typed into the PM tool (matches the "Short" column)
const CATS = {"Travel":"T","Service":"S","Misc":"M","Annual Leave":"A"};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

let user = null, weekStart = mondayOf(new Date()), entries = [], editId = null, unsub = null;
const jobs = new Set();

// ---------- date helpers (local time) ----------
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function parseIso(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }
const fmt = (d, o) => d.toLocaleDateString("en-GB", o);
const mins = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const dur = m => `${Math.floor(m/60)}h${m%60 ? " "+pad(m%60)+"m" : ""}`;

// ---------- UI setup ----------
$("cat").innerHTML = Object.keys(CATS).map(c => `<option>${c}</option>`).join("");
$("date").value = iso(new Date());

$("in").onclick = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { say("Sign-in failed: " + e.code); }
};
$("out").onclick = () => signOut(auth);
$("prev").onclick = () => { weekStart = addDays(weekStart, -7); listen(); };
$("next").onclick = () => { weekStart = addDays(weekStart, 7); listen(); };
$("date").onchange = suggestStart;
$("cancel").onclick = resetForm;
$("f").onsubmit = save;

function say(t){ $("msg").textContent = t || ""; }

onAuthStateChanged(auth, async u => {
  user = u;
  $("login").hidden = !!u; $("app").hidden = !u; $("out").hidden = !u;
  if (unsub) { unsub(); unsub = null; }
  if (!u) return;
  loadJobs();
  listen();
});

async function loadJobs(){
  try {
    const q = query(col(), orderBy("date","desc"), limit(300));
    (await getDocs(q)).forEach(d => jobs.add(d.data().job));
    fillJobs();
  } catch (e) { say("Could not load recent jobs: " + e.code); }
}
function fillJobs(){ $("jobs").innerHTML = [...jobs].sort().map(j => `<option value="${esc(j)}">`).join(""); }

const col = () => collection(db, "users", user.uid, "entries");

function listen(){
  if (unsub) unsub();
  const q = query(col(), where("date", ">=", iso(weekStart)), where("date", "<=", iso(addDays(weekStart, 6))));
  unsub = onSnapshot(q, snap => {
    entries = snap.docs.map(d => ({id: d.id, ...d.data()}));
    entries.sort((a,b) => (a.date+a.start).localeCompare(b.date+b.start));
    say(""); render(); suggestStart();
  }, e => say("Could not load entries: " + e.code));
}

// ---------- render ----------
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function render(){
  $("wk").textContent = `${fmt(weekStart,{day:"numeric",month:"short"})} to ${fmt(addDays(weekStart,6),{day:"numeric",month:"short",year:"numeric"})}`;
  let html = "";
  for (let i = 0; i < 7; i++) {
    const d = addDays(weekStart, i), key = iso(d);
    const list = entries.filter(e => e.date === key);
    if (i >= 5 && !list.length) continue;
    const total = list.reduce((s,e) => s + mins(e.end) - mins(e.start), 0);
    html += `<section class="card day"><h2>${fmt(d,{weekday:"long",day:"numeric",month:"short"})}<span>${list.length ? dur(total) : ""}</span></h2>`;
    html += list.length ? list.map(e => `
      <div class="entry">
        <span class="t">${e.start}-${e.end}</span>
        <span>${esc(e.job)}</span>
        <span>
          <button class="link" data-edit="${e.id}">Edit</button>
          <button class="link del" data-del="${e.id}">Delete</button>
        </span>
        <span class="m"></span><span class="m">${esc(e.category)} (${esc(e.code)}), ${dur(mins(e.end)-mins(e.start))}</span>
      </div>`).join("") + `<div class="row" style="margin-top:8px"><button data-copy="${key}">Copy day for Excel</button></div>`
      : `<p class="empty">No entries.</p>`;
    html += `</section>`;
  }
  $("days").innerHTML = html;
}

$("days").onclick = async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.edit) startEdit(b.dataset.edit);
  if (b.dataset.del && confirm("Delete this entry?")) {
    try { await deleteDoc(doc(col(), b.dataset.del)); if (editId === b.dataset.del) resetForm(); }
    catch (err) { say("Delete failed: " + err.code); }
  }
  if (b.dataset.copy) copyDay(b.dataset.copy, b);
};

// Excel columns B..F: Category, Job (Pop Up), Time A, Time B, Short
async function copyDay(key, btn){
  const tsv = entries.filter(e => e.date === key)
    .map(e => [e.category, e.job, e.start, e.end, e.code].join("\t")).join("\n");
  try { await navigator.clipboard.writeText(tsv); btn.textContent = "Copied"; setTimeout(() => btn.textContent = "Copy day for Excel", 1500); }
  catch { say("Copy failed. Your browser blocked clipboard access."); }
}

// ---------- form ----------
function startEdit(id){
  const e = entries.find(x => x.id === id); if (!e) return;
  editId = id;
  $("date").value = e.date; $("cat").value = e.category; $("job").value = e.job;
  $("start").value = e.start; $("end").value = e.end;
  $("save").textContent = "Save changes"; $("cancel").hidden = false;
  $("f").scrollIntoView({behavior:"smooth"});
}
function resetForm(){
  editId = null; $("job").value = ""; $("end").value = "";
  $("save").textContent = "Add entry"; $("cancel").hidden = true;
  suggestStart();
}
function suggestStart(){
  if (editId) return;
  const last = entries.filter(e => e.date === $("date").value).map(e => e.end).sort().pop();
  if (last) $("start").value = last;
}

async function save(ev){
  ev.preventDefault();
  const job = $("job").value.trim(), start = $("start").value, end = $("end").value, cat = $("cat").value;
  if (!job) return say("Enter a job name.");
  if (mins(end) <= mins(start)) return say("End time must be after start time.");
  const data = {date: $("date").value, category: cat, code: CATS[cat], job, start, end, updated: Date.now()};
  try {
    if (editId) await setDoc(doc(col(), editId), data); else await addDoc(col(), data);
    jobs.add(job); fillJobs(); say("");
    const w = mondayOf(parseIso(data.date));
    const moved = iso(w) !== iso(weekStart);
    if (moved) { weekStart = w; listen(); }
    const wasEdit = !!editId;
    editId = null; $("save").textContent = "Add entry"; $("cancel").hidden = true;
    $("job").value = ""; $("end").value = ""; $("start").value = end;
    if (wasEdit) suggestStart();
  } catch (e) { say("Save failed: " + e.code); }
}
</script>
</body>
</html>
