<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timesheet log</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 20px; color: #333; }
        h1 { font-size: 24px; margin-bottom: 20px; }
        .btn { padding: 6px 12px; margin-right: 8px; border: 1px solid #ccc; background: #fafafa; cursor: pointer; border-radius: 4px; font-size: 14px; }
        .btn:hover { background: #eaeaea; }
        .btn-green { background: #2da44e; color: white; border-color: #24823e; }
        .btn-green:hover { background: #2c974b; }
        .form-row { margin: 15px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        label { font-weight: bold; font-size: 14px; }
        input, select { padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f5f5f5; }
        .nav-links { margin-top: 15px; font-size: 14px; }
        .nav-links a { color: #0969da; text-decoration: none; margin-right: 10px; }
    </style>
</head>
<body>

    <h1>Timesheet log</h1>
    
    <div>
        <button class="btn" onclick="alert('Sign in functionality goes here')">Sign in with Google</button>
        <button class="btn" onclick="copyWeek()">Copy week</button>
        <!-- The new annotation button running alongside your existing setup -->
        <button class="btn btn-green" onclick="copyWageSlipAnnotation()">Annotate Wage Slip</button>
    </div>

    <div class="form-row">
        <div>
            <label>Date</label><br>
            <input type="date" id="txDate">
        </div>
        <div>
            <label>Category</label><br>
            <select id="txCategory">
                <option value="BAU">BAU</option>
                <option value="Project">Project</option>
                <option value="Overtime">Overtime</option>
            </select>
        </div>
        <div>
            <label>Job (Pop Up)</label><br>
            <input type="text" id="txJob" placeholder="e.g. Meeting">
        </div>
        <div>
            <label>Start</label><br>
            <input type="time" id="txStart">
        </div>
        <div>
            <label>End</label><br>
            <input type="time" id="txEnd">
        </div>
    </div>

    <div>
        <button class="btn" onclick="addEntry()">Add entry</button>
        <button class="btn" onclick="cancelEdit()">Cancel edit</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Job (Pop Up)</th>
                <th>Start</th>
                <th>End</th>
            </tr>
        </thead>
        <tbody id="logTableBody">
            <!-- Logged rows will appear here -->
        </tbody>
    </table>

    <div class="nav-links">
        <a href="#" onclick="alert('Previous week')">Prev</a>
        <a href="#" onclick="alert('Next week')">Next</a>
    </div>

    <script>
        // Array holding your logged shifts for the current week
        let logEntries = [
            { date: '2026-10-26', category: 'BAU', job: 'System Setup', start: '08:00', end: '16:30' }, // 8.5
            { date: '2026-10-27', category: 'BAU', job: 'Dev Support', start: '08:00', end: '16:30' },  // 8.5
            { date: '2026-10-28', category: 'BAU', job: 'Deployment', start: '08:00', end: '19:15' },   // 11.25
            { date: '2026-10-29', category: 'BAU', job: 'Code Review', start: '08:00', end: '18:45' },  // 10.75
            { date: '2026-10-30', category: 'BAU', job: 'Maintenance', start: '08:00', end: '18:15' }   // 10.25
        ];

        // Renders existing entries into the table on page load
        function renderTable() {
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = '';
            logEntries.forEach(entry => {
                const row = `<tr>
                    <td>${entry.date}</td>
                    <td>${entry.category}</td>
                    <td>${entry.job}</td>
                    <td>${entry.start}</td>
                    <td>${entry.end}</td>
                </tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }

        // Form handling functions
        function addEntry() {
            const date = document.getElementById('txDate').value;
            const category = document.getElementById('txCategory').value;
            const job = document.getElementById('txJob').value;
            const start = document.getElementById('txStart').value;
            const end = document.getElementById('txEnd').value;

            if(date && job && start && end) {
                logEntries.push({ date, category, job, start, end });
                renderTable();
                cancelEdit();
            } else {
                alert("Please fill in all fields.");
            }
        }

        function cancelEdit() {
            document.getElementById('txDate').value = '';
            document.getElementById('txJob').value = '';
            document.getElementById('txStart').value = '';
            document.getElementById('txEnd').value = '';
        }

        // Your original functional handler for copying tab-separated rows for AHK
        function copyWeek() {
            if (logEntries.length === 0) return alert("Nothing to copy!");
            let clipText = "";
            logEntries.forEach(e => {
                // Formatting date back to DD/MM/YYYY for the AHK script parser
                const [y, m, d] = e.date.split('-');
                const formattedDate = `${d}/${m}/${y}`;
                clipText += `${formattedDate}\t${e.category}\t${e.job}\t${e.start}\t${e.end}\tShort\n`;
            });
            navigator.clipboard.writeText(clipText.trim()).then(() => alert("Week copied for AHK script!"));
        }

        // NEW: Generates the structured, mathematical text block for your PDF wage slips
        function copyWageSlipAnnotation() {
            const annualSalary = 51249.96;
            const otRate = (annualSalary / 52 / 5 / 7.5 * 1.5).toFixed(3); // Result: 39.423

            if (!logEntries || logEntries.length === 0) return alert("No entries found!");

            let totalHours = 0;
            
            // Sort to ensure the top entry reflects the beginning of the work week
            const sorted = [...logEntries].sort((a, b) => new Date(a.date) - new Date(b.date));
            
            // Format week commencing date format cleanly (e.g. 26-Oct-26)
            const firstDateObj = new Date(sorted[0].date);
            const options = { day: '2-digit', month: 'short', year: '2-digit' };
            const wcDate = firstDateObj.toLocaleDateString('en-GB', options).replace(/ /g, '-');

            // Sum up total elapsed decimal hours
            sorted.forEach(e => {
                if (e.start && e.end) {
                    let [sH, sM] = e.start.split(':').map(Number);
                    let [eH, eM] = e.end.split(':').map(Number);
                    totalHours += (eH + eM/60) - (sH + sM/60);
                }
            });

            // Isolate net overtime and calculate payout value
            let otHours = Math.max(0, totalHours - 37.5).toFixed(2);
            let amountPaid = (otHours * otRate).toFixed(2);

            // Construct exact layout format matching your historical PDF annotations
            const textBlock = `£${annualSalary.toFixed(2)} pa equates to OT rate of ${otRate}
(${annualSalary.toFixed(2)}/52/5/7.5)x1.5 = ${otRate}
Therefore OT AMOUNT PAID = UNITS x ${otRate}
w/c          Hours
${wcDate}    ${otHours}
TOTAL        ${otHours}
Claimed      ${otHours}  £${amountPaid}`;

            navigator.clipboard.writeText(textBlock).then(() => alert("Overtime text block copied! Paste directly onto your PDF."));
        }

        // Initialize view
        renderTable();
    </script>
</body>
</html>
